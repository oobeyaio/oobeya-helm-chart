{{- if .Values.vault.enabled }}
{{- $ns := .Values.namespace }}
{{- $store := .Values.vault.secretStore }}
{{- $interval := .Values.vault.refreshInterval }}
{{- $paths := .Values.vault.paths }}

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-oobeya-mongo
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $interval | quote }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.oobeyaMongo.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $paths.mongo }}

